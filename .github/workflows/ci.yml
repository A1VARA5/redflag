name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Tests use no network and no real keys; these placeholders only satisfy SDK constructors.
      - run: npm test
        env:
          ANTHROPIC_API_KEY: test
          REDFLAG_SECRET: test
